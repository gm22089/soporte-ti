<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control Logístico y Soporte Técnico TI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 font-sans flex flex-col">

  <!-- NOTIFICACIONES TOAST -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 max-w-md space-y-2"></div>

  <!-- PANTALLA DE INICIO DE SESIÓN -->
  <div id="login-screen" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full shadow-2xl border border-slate-800 overflow-hidden">
      <div class="bg-slate-900 text-white p-6 text-center border-b border-slate-800">
        <div class="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg">
          <i data-lucide="shield-check" class="w-8 h-8 text-white"></i>
        </div>
        <h2 class="text-xl font-bold tracking-tight">Acceso al Sistema TI</h2>
        <p class="text-xs text-slate-400 mt-1">Control Logístico y Taller de Soporte Técnico</p>
      </div>

      <form id="form-login" class="p-6 space-y-4">
        <div id="login-status-msg" class="text-xs text-center text-amber-700 bg-amber-50 border border-amber-200 py-2 px-3 rounded-lg">
          Conectando con Firebase...
        </div>
        <div id="login-error" class="hidden text-xs font-semibold text-red-700 bg-red-50 border border-red-200 py-2.5 px-3 rounded-lg"></div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Nombre de usuario</label>
          <div class="relative">
            <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input type="text" id="login-username" required autocomplete="username" placeholder="Ej. ruthva o usuarioAsignado" class="w-full pl-10 pr-3.5 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Contraseña</label>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input type="password" id="login-password" required autocomplete="current-password" placeholder="••••••••" class="w-full pl-10 pr-3.5 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
        </div>

        <button type="submit" id="btn-login-submit" disabled class="w-full py-3 px-4 rounded-xl text-sm font-bold bg-blue-600 hover:bg-blue-700 disabled:bg-slate-400 text-white shadow-md transition">
          Ingresar al Sistema
        </button>
      </form>
    </div>
  </div>

  <!-- APLICACIÓN PRINCIPAL -->
  <div id="app-shell" class="hidden flex-col min-h-screen">
    <header class="bg-slate-900 text-white shadow-lg border-b border-slate-800 sticky top-0 z-30">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
          <div class="flex items-center gap-3">
            <div class="p-2.5 bg-blue-600 rounded-xl shadow-inner">
              <i data-lucide="laptop" class="w-6 h-6 text-white"></i>
            </div>
            <div>
              <div class="flex items-center gap-2">
                <h1 class="text-lg sm:text-xl font-bold tracking-tight">Control Logístico y Soporte Técnico TI</h1>
                <span id="db-status-badge" class="hidden sm:inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                  <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  Firestore en vivo
                </span>
              </div>
              <p class="text-xs text-slate-300">Recepción Logística, Taller de Reparación y Auditoría</p>
            </div>
          </div>

          <div class="flex items-center gap-2.5 self-start md:self-auto bg-slate-800/90 px-3 py-1.5 rounded-xl border border-slate-700">
            <div class="text-right">
              <p id="header-user-name" class="text-xs font-bold text-white leading-tight">—</p>
              <span id="header-user-role" class="inline-block text-[10px] font-extrabold uppercase tracking-wider px-1.5 py-0.2 rounded bg-blue-500/20 text-blue-300">—</span>
            </div>
            <button type="button" id="btn-logout" class="p-2 rounded-lg bg-slate-700 hover:bg-rose-600 text-slate-200 hover:text-white transition" title="Cerrar sesión">
              <i data-lucide="log-out" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- NAVEGACIÓN POR PESTAÑAS -->
        <nav class="mt-4 flex overflow-x-auto gap-1.5 pb-1 no-scrollbar">
          <button type="button" data-tab="general" class="nav-tab-btn inline-flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-semibold whitespace-nowrap transition bg-blue-600 text-white shadow-md">
            <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
            Vista General (Panel Diario)
            <span id="badge-nav-general" class="ml-1 px-2 py-0.5 text-xs rounded-full bg-slate-950/50 text-white">0</span>
          </button>

          <button type="button" data-tab="recepcion" class="nav-tab-btn inline-flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-semibold whitespace-nowrap transition text-slate-300 hover:bg-slate-800 hover:text-white">
            <i data-lucide="clipboard-list" class="w-4 h-4"></i>
            Recepción de Equipos (Logística)
          </button>

          <button type="button" data-tab="soporte" class="nav-tab-btn inline-flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-semibold whitespace-nowrap transition text-slate-300 hover:bg-slate-800 hover:text-white">
            <i data-lucide="wrench" class="w-4 h-4"></i>
            Soporte Técnico (Taller)
            <span class="ml-1 flex items-center gap-1">
              <span id="badge-nav-espera" class="hidden px-1.5 py-0.5 text-xs rounded-full bg-amber-500 text-slate-950 font-bold">0</span>
              <span id="badge-nav-reparacion" class="hidden px-1.5 py-0.5 text-xs rounded-full bg-sky-400 text-slate-950 font-bold">0</span>
            </span>
          </button>

          <button type="button" data-tab="historial" class="nav-tab-btn inline-flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-semibold whitespace-nowrap transition text-slate-300 hover:bg-slate-800 hover:text-white">
            <i data-lucide="history" class="w-4 h-4"></i>
            Historial Global (Todas las fechas)
            <span id="badge-nav-historial" class="ml-1 px-2 py-0.5 text-xs rounded-full bg-slate-950/50 text-slate-200">0</span>
          </button>

          <!-- PESTAÑA EXCLUSIVA ADMIN (SIN CLASE FLEX CONFLICTVA) -->
          <button type="button" id="nav-tab-admin" data-tab="admin" class="hidden nav-tab-btn items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-semibold whitespace-nowrap transition text-amber-300 hover:bg-slate-800 border border-amber-500/30">
            <i data-lucide="shield" class="w-4 h-4"></i>
            Panel Admin
          </button>
        </nav>
      </div>
    </header>

    <!-- ALERTA ERROR BD -->
    <div id="db-error-banner" class="hidden max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 mt-4">
      <div class="bg-red-50 border border-red-300 text-red-800 px-4 py-3 rounded-xl flex items-center gap-3">
        <i data-lucide="alert-circle" class="w-5 h-5 text-red-600 shrink-0"></i>
        <p id="db-error-text" class="text-sm font-medium"></p>
      </div>
    </div>

    <!-- BARRA DE CONTROL DE FECHA (SIN BOTÓN MAÑANA) -->
    <section id="daily-control-bar" class="max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 pt-6">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-5">
        <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
          <div class="flex flex-col sm:flex-row sm:items-center gap-3">
            <div class="flex items-center gap-2">
              <div class="p-2 bg-blue-50 text-blue-700 rounded-lg border border-blue-100">
                <i data-lucide="calendar" class="w-5 h-5"></i>
              </div>
              <div>
                <div class="flex items-center gap-2">
                  <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Jornada Operativa</span>
                  <span id="daily-tag-badge" class="px-2 py-0.5 rounded text-[10px] font-bold tracking-wide bg-blue-600 text-white">HOY</span>
                </div>
                <p id="daily-readable-date" class="text-sm sm:text-base font-bold text-slate-900 capitalize"></p>
              </div>
            </div>

            <div class="flex flex-wrap items-center gap-1.5 sm:ml-2">
              <button type="button" id="btn-date-yesterday" class="px-3 py-1.5 rounded-lg text-xs font-semibold border transition bg-slate-50 text-slate-700 border-slate-300 hover:bg-slate-100">Ayer</button>
              <button type="button" id="btn-date-today" class="px-3 py-1.5 rounded-lg text-xs font-semibold border transition bg-blue-600 text-white border-blue-600">Hoy</button>
              <input type="date" id="input-selected-date" aria-label="Seleccionar fecha específica" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold border border-slate-300 bg-white text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>
          </div>

          <!-- Buscador del día -->
          <div class="w-full lg:w-96">
            <div class="relative">
              <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
              <input type="text" id="input-daily-search" placeholder="Buscar en esta fecha (Serie, NIE, CE...)" class="w-full pl-10 pr-9 py-2 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition" />
              <button type="button" id="btn-clear-daily-search" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 p-1" title="Limpiar búsqueda">
                <i data-lucide="x" class="w-4 h-4"></i>
              </button>
            </div>
            <p class="text-[11px] text-slate-500 mt-1 flex items-center justify-between px-1">
              <span>Filtro aislado por fecha seleccionada</span>
              <span id="daily-filter-count" class="font-semibold text-slate-700">0 de 0 registros</span>
            </p>
          </div>
        </div>
      </div>
    </section>

    <!-- CONTENEDORES MODULARES (SE CARGAN DESDE views/*.html) -->
    <main class="max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 flex-1">
      <div id="container-general"></div>
      <div id="container-recepcion"></div>
      <div id="container-soporte"></div>
      <div id="container-historial"></div>
      <div id="container-admin"></div>
    </main>
  </div>

  <!-- CONTENEDOR MODALES -->
  <div id="container-modals"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
